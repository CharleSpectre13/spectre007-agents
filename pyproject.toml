[project]
name = "spectre-training"
version = "0.1.0"
description = "Training environment for spectre007 agent models: supervised fine-tuning with optional LoRA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "datasets>=3.2",
    "trl>=0.17",
    "peft>=0.15",
    "accelerate>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
spectre-train = "spectre_training.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectre_training"]

# Cloud Agent VMs are CPU-only, so Linux resolves torch from the CPU wheel
# index to keep installs small and reproducible. For GPU training hosts,
# repoint this index (e.g. to https://download.pytorch.org/whl/cu128).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
