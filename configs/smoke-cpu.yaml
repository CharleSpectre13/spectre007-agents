# Tiny CPU-only smoke run that proves the training stack end to end in
# under a minute: model download, LoRA adaptation, SFT loop, checkpoint save.
model: sshleifer/tiny-gpt2

dataset:
  path: data/smoke.jsonl

lora:
  r: 8
  lora_alpha: 16
  target_modules: ["c_attn"]
  task_type: CAUSAL_LM

sft:
  output_dir: outputs/smoke-cpu
  max_steps: 8
  per_device_train_batch_size: 4
  learning_rate: 2.0e-4
  logging_steps: 1
  max_length: 64
  seed: 42
  report_to: none
  use_cpu: true
