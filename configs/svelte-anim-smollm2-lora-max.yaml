# Maximum-effort CPU run on the Svelte animations dataset: higher-rank LoRA
# covering attention and MLP projections, ~28 epochs. This is the deepest run
# that stays practical on a 4-core CPU-only Cloud Agent VM (~20 minutes).
model: HuggingFaceTB/SmolLM2-135M

dataset:
  path: data/svelte-animations/train.jsonl

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: CAUSAL_LM

sft:
  output_dir: outputs/svelte-anim-smollm2-lora-max
  max_steps: 150
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 10
  logging_steps: 5
  max_length: 768
  seed: 42
  report_to: none
  use_cpu: true
  save_strategy: "no"

record:
  dir: runs
  name: svelte-anim-smollm2-lora-max
