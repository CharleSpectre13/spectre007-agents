# Main run on the Svelte animations dataset: LoRA fine-tune of a real
# pretrained 135M-parameter model on CPU. max_length 768 covers the longest
# dataset row (695 tokens) so no training text is truncated.
model: HuggingFaceTB/SmolLM2-135M

dataset:
  path: data/svelte-animations/train.jsonl

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  task_type: CAUSAL_LM

sft:
  output_dir: outputs/svelte-anim-smollm2-lora
  max_steps: 60
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 5
  logging_steps: 2
  max_length: 768
  seed: 42
  report_to: none
  use_cpu: true
  save_strategy: "no"

record:
  dir: runs
  name: svelte-anim-smollm2-lora
